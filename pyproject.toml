[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entangletronica"
version = "0.1.0"
description = "Flying-electron quantum interference devices engineered with electrostatic gates"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
include = ["entangletronica*"]
