name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies (exact, from lock)
        run: pip install -r requirements-lock.txt

      - name: Install test runner
        run: pip install pytest

      # Rebuild every committed artefact from the raw simulation so CI checks
      # end-to-end reproducibility (not just that an old JSON still exists).
      - name: Rebuild metrics + figures from raw simulation
        run: python scripts/make_figures.py

      - name: Rebuild stochastic dephasing ensemble (JSON before EQLI figures/tests)
        run: python scripts/ensemble_coherence.py

      # Referee due-diligence checks (paper Sec. 2.4/robustness): each
      # re-generates its committed results/*.json with fixed seeds.
      - name: Rebuild ensemble-size convergence check
        run: python scripts/ensemble_convergence.py

      - name: Rebuild noise-scale sensitivity check
        run: python scripts/scale_sensitivity.py

      - name: Rebuild spatially correlated noise check
        run: python scripts/noise_correlation.py

      - name: Rebuild cross-arm selectivity (cross-talk ratio, Sec. 2.3)
        run: python scripts/compute_selectivity.py

      - name: Rebuild robustness multi-panel figure
        run: python scripts/make_robustness_figure.py

      - name: Rebuild EQLI paper figures (Poisson mapping, coherence, XOR)
        run: python scripts/make_missing_figures.py

      - name: Rebuild in-flight animation
        run: python scripts/make_animation.py

      - name: Run test suite (incl. headline-number regression pin)
        run: python -m pytest tests/ -q

      - name: Confirm metrics JSON is the reconciled, self-labelled format
        run: |
          python - <<'PY'
          import json
          m = json.load(open("results/entangletron_metrics.json"))
          assert m["convergence_imbalance_by_dx"]["readout_functional"] == "box_sum_legacy"
          assert m["convergence_imbalance_continuous"]["readout_functional"] == "continuous_interpolated"
          print("metrics reconciliation OK")
          PY